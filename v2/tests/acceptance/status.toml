# Scenario status file (PLAN.md §3, T3) — the single source of truth for
# what CI currently expects: each acceptance scenario's status, and the
# minimum coverage achieved so far. The test runner (tests/run.py)
# enforces it in BOTH directions: a `pass` scenario that fails blocks CI,
# and an `xfail` scenario that passes is ALSO an error (it forces the
# status update, so progress is always recorded here). Development
# progress IS the sequence of xfail -> pass diffs in this file.
#
# "xfail" = expected failure, the term LLVM lit (XFAIL:) and pytest use.
#
# PR 01 commits the schema; the Phase 1 scenario entries (S1, S6-S9)
# and the first min_coverage entries land with the fixture corpus in
# PR 02.
#
# Scenario schema:
#
#   [[scenario]]
#   id = "S1"                 # PLAN.md §4 row
#   case = "s1-blocktiling"   # case dir under tests/acceptance/ or
#                             #   tests/cli/
#   status = "xfail"          # xfail | pass
#
# Minimum-coverage schema (minimums may only rise):
#
#   [[min_coverage]]
#   metric = "instructions_classified"  # key in the result JSON's
#                                       #   "coverage" object
#   percent = 0.0                       # rewritten upward by --raise-min
#   enforced = false                    # flips true at the PR that lands
#                                       #   the emitting analysis
#
# Format contract for --raise-min: inside a [[min_coverage]] block the
# `metric` line precedes its `percent` line; the runner rewrites the
# number in place, so every raise is visible as a diff of this file.
