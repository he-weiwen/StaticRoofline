# NVIDIA V100-SXM2-16GB (GV100) — the canonical sm_70 part.
# Source: NVIDIA Tesla V100 GPU Architecture whitepaper (WP-08608-001),
# 2017: FP64 7.8 TFLOPS, FP32 15.7 TFLOPS, FP16 31.4 TFLOPS (cuda
# cores, non-tensor); HBM2 900 GB/s.
name = "Tesla V100-SXM2-16GB"
arch = "sm_70"
dram_bw_gbps = 900.0

[peak_tflops]
f16 = 31.4
f32 = 15.7
f64 = 7.8

# Tensor cores. Source: NVIDIA Tesla V100 GPU Architecture whitepaper
# (WP-08608-001), Table 1 "Comparison of NVIDIA Tesla GPUs": Peak
# Tensor TFLOPS 125 (FP16 multiply, FP32 accumulate — the only
# tensor-core precision on Volta). Dense; Volta has no sparsity mode.
[tensor_peak_tflops]
f16 = 125.0
